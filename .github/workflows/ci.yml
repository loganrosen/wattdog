name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Unit tests
        run: ./gradlew :core:batterystats:test
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wattdog-debug
          path: app/build/outputs/apk/debug/*.apk
